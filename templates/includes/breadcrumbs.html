<nav class="breadcrumb-agro" aria-label="breadcrumb">
  <a href="{% url 'core:home' %}"><i class="bi bi-house-door"></i> Home</a>
  {% for crumb in breadcrumbs %}
    <span class="mx-1">/</span>
    {% if forloop.last %}
      <span class="active">{{ crumb.label }}</span>
    {% else %}
      <a href="{{ crumb.url }}">{{ crumb.label }}</a>
    {% endif %}
  {% endfor %}
</nav>
