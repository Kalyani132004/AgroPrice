{% if messages %}
<div class="toast-container-agro">
  {% for message in messages %}
    <div class="toast toast-agro align-items-center text-white
        {% if message.tags == 'error' %}bg-danger
        {% elif message.tags == 'success' %}bg-success
        {% elif message.tags == 'warning' %}bg-warning text-dark
        {% else %}bg-info{% endif %} border-0"
        role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">{{ message }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  {% endfor %}
</div>
{% endif %}
